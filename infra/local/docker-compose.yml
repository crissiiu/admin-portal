services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sales_builder
      MYSQL_PASSWORD: sales_builder
      MYSQL_DATABASE: sales_builder_auth
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init/01-create-service-databases.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
      - ../../services/auth-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/02-auth-service.sql:ro
      - ../../services/auth-service/database/migrations/0002_auth_runtime_schema.sql:/docker-entrypoint-initdb.d/03-auth-runtime.sql:ro
      - ../../services/user-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/04-user-service.sql:ro
      - ../../services/product-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/05-product-service.sql:ro
      - ../../services/catalog-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/06-catalog-service.sql:ro
      - ../../services/inventory-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/07-inventory-service.sql:ro
      - ../../services/cart-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/08-cart-service.sql:ro
      - ../../services/order-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/09-order-service.sql:ro
      - ../../services/payment-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/10-payment-service.sql:ro
      - ../../services/discount-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/11-discount-service.sql:ro
      - ../../services/content-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/12-content-service.sql:ro
      - ../../services/audit-log-service/database/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/13-audit-log-service.sql:ro

  redis:
    image: redis:8.4.0-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  mysql-data:
